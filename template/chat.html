<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - {{ username }}</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121214;
            color: #eceeed;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 600px;
            height: 720px;
            background: #1c1c21;
            border: 1px solid #2e2e38;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 20px 24px;
            background: #18181b;
            border-bottom: 1px solid #2e2e38;
        }

        .header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
        }

        .username {
            margin-top: 4px;
            color: #9ea0a6;
            font-size: 14px;
        }

        .user-selection {
            padding: 16px 24px;
            border-bottom: 1px solid #2e2e38;
            background: #1c1c21;
        }

        .user-selection label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #9ea0a6;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #2e2e38;
            border-radius: 8px;
            font-size: 15px;
            background-color: #121214;
            color: #ffffff;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: #52525b;
        }

        .status {
            padding: 10px 24px;
            font-size: 13px;
            color: #9ea0a6;
            background: #141417;
            border-bottom: 1px solid #2e2e38;
        }

        #chatBox {
            flex: 1;
            display: none;
            flex-direction: column;
            min-height: 0;
        }

        .chat-with {
            padding: 12px 24px;
            background: #18181b;
            border-bottom: 1px solid #2e2e38;
            font-size: 14px;
            font-weight: 500;
            color: #e4e4e7;
        }

        .messages {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #1c1c21;
        }

        .message {
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 75%;
            word-break: break-word;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.mine {
            align-self: flex-end;
            background: #27272a;
            color: #ffffff;
            border: 1px solid #3f3f46;
        }

        .message.theirs {
            align-self: flex-start;
            background: #141417;
            color: #d4d4d8;
            border: 1px solid #2e2e38;
        }

        .input-area {
            padding: 16px 24px;
            border-top: 1px solid #2e2e38;
            background: #18181b;
            display: flex;
            gap: 12px;
        }

        #messageInput {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #2e2e38;
            border-radius: 8px;
            background-color: #121214;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        #messageInput::placeholder {
            color: #63636e;
        }

        #messageInput:focus {
            border-color: #52525b;
        }

        #sendButton {
            padding: 10px 20px;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            background: #27272a;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        #sendButton:hover:not(:disabled) {
            background: #3f3f46;
        }

        #sendButton:disabled {
            background: #18181b;
            color: #52525b;
            border-color: #27272a;
            cursor: not-allowed;
        }

        .attach-btn {
            padding: 10px 14px;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            background: #27272a;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .attach-btn:hover:not(:disabled) {
            background: #3f3f46;
        }

        .attach-btn:disabled {
            background: #18181b;
            color: #52525b;
            border-color: #27272a;
            cursor: not-allowed;
        }

        .message img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <h2>Chat</h2>
            <div class="username">
                You are: <strong>{{ username }}</strong>
            </div>
        </div>

        <div class="user-selection">
            <label for="targetUser">Who do you want to chat with?</label>
            <select id="targetUser">
                <option value="">Select a user</option>
            </select>
        </div>

        <div id="status" class="status">Connecting...</div>

        <div id="chatBox">
            <div id="chatWith" class="chat-with"></div>
            <div id="messages" class="messages"></div>
            <div class="input-area">
                <input type="file" id="fileInput" accept=".png,.jpg,.jpeg" style="display: none;" onchange="handleFileSelect(event)">
                <button id="attachButton" class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Attach Image" disabled>📎</button>
                <input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off">
                <button id="sendButton" onclick="sendMessage()" disabled>Send</button>
            </div>
        </div>
    </div>

    <script>
        const username = "{{ username }}";

        const socket = new WebSocket(
            `ws://${window.location.host}/ws/${encodeURIComponent(username)}`
        );

        const status = document.getElementById("status");
        const targetUser = document.getElementById("targetUser");
        const chatBox = document.getElementById("chatBox");
        const chatWith = document.getElementById("chatWith");
        const messages = document.getElementById("messages");
        const messageInput = document.getElementById("messageInput");
        const sendButton = document.getElementById("sendButton");
        const attachButton = document.getElementById("attachButton");
        const fileInput = document.getElementById("fileInput");

        let selectedUser = null;
        let convo = {};

        socket.onopen = () => {
            console.log("WebSocket connected as:", username);
            status.textContent = "Connected";
            loadUsers();
        };

        socket.onmessage = (event) => {
            console.log("Message received:", event.data);
            try {
                const data = JSON.parse(event.data);
                const partner = data.from;
                if (partner) {
                    if (!convo[partner]) {
                        convo[partner] = [];
                    }
                    convo[partner].push(data);

                    // Only display if the message complies with selected user and to/from validation
                    if (selectedUser && partner === selectedUser && data.to === username) {
                        displayMessage(data);
                    }
                }
            } catch (e) {
                console.error("Failed to parse incoming WebSocket message:", e);
            }
        };

        socket.onerror = (error) => {
            console.error("WebSocket error:", error);
            status.textContent = "Connection error";
        };

        socket.onclose = () => {
            console.log("WebSocket disconnected");
            status.textContent = "Disconnected";
            sendButton.disabled = true;
            attachButton.disabled = true;
        };

        async function loadUsers() {
            try {
                const response = await fetch("/ws/connections");
                const users = await response.json();
                console.log("Available users:", users);

                targetUser.innerHTML = `<option value="">Select a user</option>`;

                users.forEach(user => {
                    if (user === username) {
                        return;
                    }
                    const option = document.createElement("option");
                    option.value = user;
                    option.textContent = user;
                    targetUser.appendChild(option);
                });
            } catch (error) {
                console.error("Failed to load users:", error);
                status.textContent = "Could not load users.";
            }
        }

        targetUser.addEventListener("change", () => {
            selectedUser = targetUser.value;

            if (selectedUser === "") {
                chatBox.style.display = "none";
                sendButton.disabled = true;
                attachButton.disabled = true;
                messages.innerHTML = "";
                return;
            }

            chatBox.style.display = "flex";
            chatWith.textContent = "Chatting with " + selectedUser;
            sendButton.disabled = false;
            attachButton.disabled = false;
            
            renderConversation(selectedUser);
            messageInput.focus();
        });

        function renderConversation(user) {
            messages.innerHTML = "";
            if (!convo[user]) return;

            convo[user].forEach(msgObj => {
                // Validate compliance with to and from
                const isValid = (msgObj.from === user && msgObj.to === username) || 
                                (msgObj.from === username && msgObj.to === user);
                if (isValid) {
                    displayMessage(msgObj);
                }
            });
        }

        function sendMessage() {
            const message = messageInput.value.trim();

            if (selectedUser === null || selectedUser === "") {
                alert("Select a user first.");
                return;
            }

            if (message === "") {
                return;
            }

            if (socket.readyState !== WebSocket.OPEN) {
                alert("WebSocket is not connected.");
                return;
            }

            const msgObj = {
                to: selectedUser,
                from: username,
                message: message,
                type: "text"
            };

            socket.send(
                JSON.stringify({
                    to: selectedUser,
                    message: message,
                    type: "text"
                })
            );

            if (!convo[selectedUser]) {
                convo[selectedUser] = [];
            }
            convo[selectedUser].push(msgObj);

            if (selectedUser) {
                displayMessage(msgObj);
            }

            messageInput.value = "";
            messageInput.focus();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (selectedUser === null || selectedUser === "") {
                alert("Select a user first.");
                event.target.value = "";
                return;
            }

            const fileName = file.name.toLowerCase();
            const allowedExtensions = [".png", ".jpg", ".jpeg"];
            const isValidExt = allowedExtensions.some(ext => fileName.endsWith(ext));

            if (!isValidExt) {
                alert("Only PNG, JPG, and JPEG images are allowed!");
                event.target.value = "";
                return;
            }

            if (socket.readyState !== WebSocket.OPEN) {
                alert("WebSocket is not connected.");
                event.target.value = "";
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                const base64Data = e.target.result;
                const msgObj = {
                    to: selectedUser,
                    from: username,
                    message: base64Data,
                    type: "image"
                };

                socket.send(
                    JSON.stringify({
                        to: selectedUser,
                        message: base64Data,
                        type: "image"
                    })
                );

                if (!convo[selectedUser]) {
                    convo[selectedUser] = [];
                }
                convo[selectedUser].push(msgObj);

                if (selectedUser) {
                    displayMessage(msgObj);
                }

                event.target.value = "";
            };
            reader.readAsDataURL(file);
        }

        function displayMessage(msgObj) {
            const message = document.createElement("div");
            message.classList.add("message");

            const isMine = msgObj.from === username;
            if (isMine) {
                message.classList.add("mine");
            } else {
                message.classList.add("theirs");
            }

            if (msgObj.type === "image") {
                const img = document.createElement("img");
                img.src = msgObj.message;
                img.alt = "Image";
                message.appendChild(img);
            } else {
                message.textContent = msgObj.message;
            }

            messages.appendChild(message);
            messages.scrollTop = messages.scrollHeight;
        }

        messageInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
