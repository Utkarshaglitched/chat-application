<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Chat</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121214;
            color: #eceeed;
        }

        .card {
            width: 380px;
            padding: 32px;
            background: #1c1c21;
            border: 1px solid #2e2e38;
            border-radius: 12px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
        }

        p {
            color: #9ea0a6;
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background-color: #121214;
            border: 1px solid #2e2e38;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.15s ease;
        }

        input::placeholder {
            color: #63636e;
        }

        input:focus {
            border-color: #52525b;
        }

        button {
            width: 100%;
            padding: 12px 14px;
            margin-top: 14px;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            background: #27272a;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        button:hover {
            background: #3f3f46;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Join Chat</h1>
        <p>Enter your username to continue</p>
        <input id="username" type="text" placeholder="Enter username" autocomplete="off">
        <button onclick="joinChat()">Continue</button>
    </div>

    <script>
        function joinChat() {
            const input = document.getElementById("username");
            const username = input.value.trim();

            if (username === "") {
                alert("Please enter a username.");
                return;
            }

            window.location.href = "/" + encodeURIComponent(username);
        }

        document.getElementById("username").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                joinChat();
            }
        });
    </script>
</body>
</html>
